<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>kerikoの行星观察笔记 · 博客已迁移</title>
  <script>
    (function () {
      // 旧 Hugo 站 URL → 新站 URL：去掉 .html 后缀，其余路径原样保留
      var path = location.pathname.replace(/\.html$/, "");
      var target =
        path === "/" || path === ""
          ? "https://keriko-blog.pages.dev/"
          : "https://keriko-blog.pages.dev" + path;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>博客已迁移至 <a href="https://keriko-blog.pages.dev">keriko-blog.pages.dev</a>，正在跳转…</p>
</body>
</html>
